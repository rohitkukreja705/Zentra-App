name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP for compileSdk 36 requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Regenerates android/ from scratch using whatever Gradle/AGP version
      # ships with the current Flutter stable - safer than hand-pinning
      # version numbers that go stale. This does NOT touch the existing
      # pubspec.yaml or lib/, only adds the missing platform folder.
      - name: Scaffold Android platform folder
        run: flutter create --platforms=android --org com.wearables .

      # Overlay the QRing SDK wiring on top of the freshly generated
      # android/ folder.
      - name: Apply QRing SDK overlay
        run: |
          set -e
          cp android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/wearables/app
          cp android_overlay/app/src/main/kotlin/com/wearables/app/*.kt android/app/src/main/kotlin/com/wearables/app/
          mkdir -p android/app/libs
          cp android_overlay/app/libs/qring_sdk_1.0.0.27.aar android/app/libs/qring_sdk_1.0.0.27.aar
          cat android_overlay/app/build.gradle.append >> android/app/build.gradle

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons from the extracted brand assets
        run: dart run flutter_launcher_icons

      - name: Flutter doctor (build diagnostics in the log)
        run: flutter doctor -v

      # QRing's native libs (libDspConfig.so etc.) only ship for
      # armeabi-v7a / arm64-v8a - no x86_64, so it's excluded here.
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
